January:
  title: Give heaters room
  tip: "Keep space heaters at least three feet from anything that can burn, including bedding, curtains, and furniture. Plug them directly into a wall outlet, never an extension cord or power strip, and turn them off when you leave the room or go to bed."
February:
  title: Make a plan!
  tip: Make a plan today. Your family may not be together if a disaster strikes, so it is important to know which <a href="http://www.ready.gov/be-informed">types of disasters</a> could affect your area. Know how you'll contact one another and reconnect if separated. Establish a family meeting place that's familiar and easy to find. 
March:
  title: Get ready for severe weather
  tip: "Spring is peak tornado season in North Alabama. Have more than one way to get warnings, such as a weather radio, phone alerts, and local TV or radio, because outdoor sirens are not meant to be heard indoors. Pick your safe spot now: the lowest floor, in an interior room with no windows. <a href=\"https://www.ready.gov/tornadoes\">Learn more about tornado safety.</a>"
April:
  title: Build a kit
  tip: "Put together an emergency kit with water, nonperishable food, medications, a flashlight, extra batteries, a first aid kit, and copies of important papers. Plan for at least three days for everyone in your home, including pets. <a href=\"https://www.ready.gov/kit\">See the full checklist.</a>"
May:
  title: Watch the water
  tip: "Drowning is fast and often silent. When kids are swimming, choose one adult to be the water watcher, with no phone and no distractions, and trade off every so often. On boats and around the lake, everyone wears a properly fitted life jacket."
June:
  title: Beat the heat
  tip: "Heat illness can strike quickly on hot, humid Alabama days. Drink water often, take breaks in the shade or air conditioning, and check on elderly neighbors. Never leave children or pets in a parked car, even for a minute. If someone is confused, stops sweating, or passes out in the heat, call 911 and start cooling them right away. <a href=\"https://www.ready.gov/heat\">Learn the warning signs.</a>"
July:
  title: Leave fireworks to the pros
  tip: "The safest way to enjoy fireworks is at a public show. If you do use them at home, follow local rules, keep a bucket of water or a hose close by, never let children handle fireworks (sparklers included), and soak used fireworks in water before throwing them away."
August:
  title: Back to school, ready for anything
  tip: "As school starts, make sure your kids know their full name, address, and a parent's phone number by heart, and that they know how and when to call 911. Update the emergency contact information on file with the school."
September:
  title: Update your plan
  tip: "September is National Preparedness Month. Take a few minutes to update your family's emergency plan and kit: replace expired food, water, and medications, check flashlight batteries, and sign up for your county's emergency alerts."
October:
  title: Practice your escape
  tip: "October is Fire Prevention Month. Make sure every room has two ways out, choose a meeting spot outside, and practice your home fire drill with everyone in the house. Test your smoke alarms, and remember that once you are out, you stay out. <a href=\"https://www.ready.gov/home-fires\">More home fire safety tips.</a>"
November:
  title: Safe heat, safe holidays
  tip: "Before the cold sets in, have your furnace, fireplace, or wood stove checked, and make sure your carbon monoxide alarms work. Thanksgiving is the top day of the year for home cooking fires, so stay in the kitchen while you cook and keep a lid nearby to smother a pan fire. Never fry a turkey indoors or on a porch."
December:
  title: Keep the holidays bright
  tip: "Water your Christmas tree every day, because a dry tree can burn in seconds. Keep it at least three feet from heat sources, check light strings for damaged cords, and turn the lights off before bed or when you leave home. Use battery candles, or never leave real ones unattended."
