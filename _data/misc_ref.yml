about:
  title: "About Our Department"
  description: "Mud Tavern Volunteer Fire and Rescue is committed to creating a strong and inclusive community that is well prepared for emergencies and disasters. Since its inception in 1975, the department has grown significantly, enabling it to put greater emphasis on community engagement and outreach. Throughout the year, our department proudly hosts a variety of events for all ages to build connections and ensure the people we serve feel valued. Holding these events allows us to further highlight our commitment and dedication to the inhabitants of our district."
# 

